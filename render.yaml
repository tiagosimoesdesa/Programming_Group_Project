services:
  - type: web
    name: beerreal-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_MODE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: beerreal
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_DAILY_FACT_MODEL
        value: gpt-6.2-astra
      - key: DAILY_CELEBRATION_TIMEZONE
        value: Europe/Lisbon

  - type: web
    name: beerreal-web
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: EXPO_PUBLIC_WEB_API_URL
        value: https://beerreal-web.onrender.com/api
      - key: EXPO_PUBLIC_WEB_SOCKET_URL
        value: https://beerreal-api.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
    routes:
      - type: rewrite
        source: /api/*
        destination: https://beerreal-api.onrender.com/*
