<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>%WEB_TITLE%</title>
    <!-- Keep the app canvas edge-to-edge while React Native safe areas protect its content. -->
    <style id="expo-reset">
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #101110;
        color-scheme: dark;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        width: 100%;
        height: 100%;
        flex: 1;
        background: #101110;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
