<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#231508" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #231508;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
        /* Match NightBackdrop where the safe-area margins expose the page. */
        background-image: linear-gradient(
          #231508 env(safe-area-inset-top, 0px),
          #0b0907 44%,
          #1d1006 calc(100% - env(safe-area-inset-bottom, 0px))
        );
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
